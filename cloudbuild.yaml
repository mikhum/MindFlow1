steps:
  # 1. Bygg Docker-imagen via Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-north1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mindflow:$COMMIT_SHA', '.']

  # 2. Pusha till Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-north1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mindflow:$COMMIT_SHA']

  # 3. Deploya direkt till Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mindflow'
      - '--image'
      - 'europe-north1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mindflow:$COMMIT_SHA'
      - '--region'
      - 'europe-north1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'europe-north1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mindflow:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
